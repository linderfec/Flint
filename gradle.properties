# ---------------------------------------------------------------------
# Flint build configuration
#
# Any key here can be overridden from the command line, e.g.
#   ./gradlew runClient -PofflinePlayerName=Alice -PwindowWidth=1280
# Command line values always win over this file.
# ---------------------------------------------------------------------

# Minecraft / ASM versions
minecraft_version=26.3
asm_version=9.10.1

# Version of the Flint agent jar
version=26.2-1.22.2-0.1.0

# Where the self-contained runtime lives (client.jar, libraries, assets, game dir).
# Kept outside build/ on purpose: `gradle clean` would delete the ~550MB of downloads.
# Change it back to build/minecraft if you prefer everything under build/.
minecraftDir=.flint/minecraft

# Optional: reuse downloads that already exist somewhere else
#assetsDir=/path/to/minecraft/assets
#runDir=/path/to/minecraft/run

# runClient: offline account name
offlinePlayerName=Dev

# runClient: fixed window size. Uncomment to force --width/--height on every launch;
# left commented the game keeps the window size it last remembered.
#windowWidth=1280
#windowHeight=720

# Downloads: threads for the first downloadAssets pass, retries and HTTP timeouts
assetDownloadThreads=8
downloadRetries=4
connectTimeoutMs=10000
readTimeoutMs=20000
